name: Build and deploy CV

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: false

      - name: Stage site
        run: |
          mkdir -p public
          cp cv.pdf public/cv.pdf
          cp site/index.html public/index.html  # neocass.com/cv -> cv.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: cv
          path: public/cv.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    # Publishes https://neocass.com/cv/cv.pdf, and /cv redirects to it (only on pushes to main)
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
